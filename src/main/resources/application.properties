spring.application.name=onboarding-tracker
server.port=8080

# Embedded H2, file based. The location can be overridden with the DB_URL environment variable.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/onboardingdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health endpoint for container health checks: GET /actuator/health
management.endpoints.web.exposure.include=health
